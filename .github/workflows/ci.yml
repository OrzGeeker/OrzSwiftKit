name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      # 只跑与 docs/spec 对齐的套件：其余既有测试依赖本机 JDK/brew，CI 上不稳定。
      - name: Test
        run: swift test --filter 'CacheKitTests|RuntimeKitTests|TransferKitTests|TransferPolicyTests|TransferTests|TransferProgressTests'
